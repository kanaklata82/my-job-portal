<!DOCTYPE html>
<html>
<head>
  <title>Kanaklata - Job Portal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-image: url('static/static/computer.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: white;
      font-family: 'Arial', sans-serif;
      text-align: center;
      padding: 50px 20px;
      min-height: 100vh;
    }
    h1 {
      font-size: 40px;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px black;
    }
    p {
      font-size: 18px;
      margin-bottom: 30px;
      text-shadow: 1px 1px 3px black;
    }
    .btn {
      display: inline-block;
      padding: 12px 25px;
      background: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      transition: 0.3s;
    }
    .btn:hover {
      background: #0056b3;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h1>Kanaklata - Job Portal</h1>
  <p>Welcome to my Job Portal Website</p>
  
  <a href="Resume.pdf" target="_blank" class="btn">Download Resume</a>

</body>
</html>
